<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sale Scout{% endblock %} — Merit House</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav>
    <div class="container--wide">
      <a href="{{ url_for('index') }}" class="nav-brand">
        Sale Scout
        <span>by Merit House</span>
      </a>
      <div class="nav-links">
        {% if current_user.is_authenticated %}
          <a href="{{ url_for('dashboard') }}">Dashboard</a>
          <a href="{{ url_for('settings') }}">Settings</a>
          <a href="{{ url_for('logout') }}">Sign out</a>
        {% else %}
          <a href="{{ url_for('login') }}">Sign in</a>
          <a href="{{ url_for('signup') }}" style="color:var(--cream);">Get started</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="container">
      <p>Sale Scout is a <a href="https://themerithouse.com" target="_blank">Merit House</a> product &nbsp;·&nbsp; <a href="https://themerithouse.com" target="_blank">themerithouse.com</a></p>
    </div>
  </footer>
</body>
</html>
